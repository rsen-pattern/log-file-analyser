name: Feature request
description: Suggest a new analysis, log format, integration, or improvement.
title: "[feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for thinking about how to make this better. Please describe the problem first, the solution second.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the SEO / log-analysis question you're trying to answer that the tool currently can't.
      placeholder: |
        I want to find URLs that Google crawls heavily but that have a high non-200 rate over time —
        the current Status Waste page only shows aggregate ratios per page type, not per URL trends.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would the solution look like?
      description: Describe the feature you imagine. UI sketches, mock data, or even just a sentence.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Other tools, workarounds, or different feature designs.

  - type: dropdown
    id: priority
    attributes:
      label: How important is this to you?
      options:
        - Nice to have
        - I'd use it weekly
        - I'd contribute the PR myself
    validations:
      required: true
